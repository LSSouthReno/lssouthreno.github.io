  const bd = pfVal('birthdate');
  if (bd !== (c.birthdate || '')) { ch.birthdate = bd; rows.push(['Birthday', c.birthdate ? fmtDate(c.birthdate, { month: 'long', day: 'numeric', year: 'numeric' }) : '', bd ? fmtDate(bd, { month: 'long', day: 'numeric', year: 'numeric' }) : '']); }
  if (PF.photo) { ch.photo = PF.photo; rows.push(['Photo', '', '<img class="pf-new" src="' + PF.photo + '" alt="">']); }
  return { ch, rows: rows.map(r => [r[0], r[0] === 'Photo' ? '' : (esc(r[1]) || blank), r[0] === 'Photo' ? r[2] : (esc(r[2]) || blank)]) };
}
function pfCheck(ch) {
  if ('phone' in ch && phoneDigits(ch.phone).length !== 10) return 'Please enter a 10-digit mobile number.';
  if ('email' in ch && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(ch.email)) return 'Please check your email address.';
  if (ch.address && !(ch.address.street1 && ch.address.city && ch.address.state && ch.address.zip)) return 'Please fill in street, city, state and ZIP.';
  if (ch.address && !/^\d{5}(-?\d{4})?$/.test(ch.address.zip)) return 'Please enter a 5-digit ZIP code.';
  if ('birthdate' in ch && !ch.birthdate) return 'To remove your birthday, please ask the church office.';
  return '';
}
function pfReview() {
  const d = pfDiff(), bad = pfCheck(d.ch);
  $('pfErr').textContent = bad; if (bad) return;
  if (!d.rows.length) { toast('Nothing has changed yet'); return; }
  PF.changes = d.ch;
  $('pfForm').style.display = 'none';
  const rv = $('pfRev'); rv.style.display = '';
  rv.innerHTML = '<div class="pf-sum">' + d.rows.map(r => '<div><b>' + r[0] + '</b>' + (r[1] ? '<s>' + r[1] + '</s>' : '') + '<span>' + r[2] + '</span></div>').join('') + '</div>' +
    '<p class="dim">This updates your profile in Planning Center, so the church office, your group and your teams see it too.</p>' +
    '<div class="err" id="pfErr2"></div>' +
    '<div class="pf-btns"><button class="btn g" onclick="pfBack()">Back</button><button class="btn p" id="pfSave" onclick="pfSave()">Save changes</button></div>';
}
function pfBack() { $('pfRev').style.display = 'none'; $('pfForm').style.display = ''; }
async function pfSave() {
  if (S.preview || !PF.changes) return;
  const b = $('pfSave'); b.disabled = true; b.textContent = 'Saving…';
  const rid = 'pf' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  const r = await api({ action: 'jr_profile_update', token: tokenGet(), changes: PF.changes, rid: rid }, 3);
  if (r.demo) { closeSheet(); return; }
  if (r.signin) { closeSheet(); return loadMe(); }
  const failed = r.failed || [], done = r.changed || [];
  if (r.profile) PF.cur = r.profile;
  if (done.length && S.data && S.data.person) {                    // show it right away; the quiet refresh below confirms it
    const p = S.data.person, np = r.profile || {};
    if (done.indexOf('nickname') >= 0) p.first = np.nickname || np.legalFirst || p.first;
    if (done.indexOf('photo') >= 0) p.avatar = np.avatar && np.avatar !== p.avatar ? np.avatar : PF.photo;
    viewJourney();
  }
  if (r.ok && !failed.length) { closeSheet(); toast('Saved. Your profile is up to date.'); }
  else if (done.length) { PF.photo = done.indexOf('photo') >= 0 ? '' : PF.photo; b.disabled = false; b.textContent = 'Save changes'; $('pfErr2').innerHTML = 'Saved some of it. Not saved: ' + failed.map(x => esc(x.error)).join(' '); }
  else { b.disabled = false; b.textContent = 'Save changes'; $('pfErr2').textContent = (failed[0] && failed[0].error) || r.error || 'That didn’t save — please try again.'; }
  if (done.length) loadMe(true);   // fresh: skip the fast API's 10-minute copy
}

// ── note / prayer ────────────────────────────────────────────────────────────
function openSheet(kind, prefill) {
  if (kind === 'profile') return openProfile();
  const pn = S.data && S.data.pastor && S.data.pastor.name ? S.data.pastor.name.split(' ')[0] : 'your pastor';
  $('sheet').innerHTML = '<h3>' + (kind === 'prayer' ? 'Share a prayer request' : 'Send ' + esc(pn) + ' a note') + '</h3>' +
    '<div class="dim">' + (kind === 'prayer' ? 'This goes to our prayer team, and ' + esc(pn) + ' is told too. It’s kept private.' : 'It goes straight to ' + esc(pn) + '.') + '</div>' +
    '<textarea id="noteTxt" placeholder="' + (kind === 'prayer' ? 'What would you like us to pray for?' : 'Write a few words…') + '">' + esc(prefill || '') + '</textarea>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn g" onclick="closeSheet()">Cancel</button>' +
    '<button class="btn p" id="noteBtn" onclick="sendNote(\'' + kind + '\')"' + (S.preview ? ' disabled title="Turned off in preview"' : '') + '>Send</button></div>';
  $('sheetOv').classList.add('open');
  setTimeout(() => { const t = $('noteTxt'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }, 50);
}
// ── Delete my account (App Store rule 5.1.1(v); promise on /privacy/) ──────────────
function openDeleteAccount() {
  if (S.preview) return;
  $('sheet').innerHTML = '<h3>Delete my account</h3>' +
    '<p class="dim" style="line-height:1.6">This signs you out on every device and asks Living Stones to remove the personal information we hold about you. ' +
    'We’ll finish within 30 days and let you know when it’s done. Giving records that tax law requires us to keep are kept. ' +
    'You’re always welcome back. Just sign in again.</p>' +
    '<textarea id="delWhy" maxlength="500" placeholder="Anything you’d like us to know? (optional)"></textarea>' +
    '<div class="err" id="delErr"></div>' +
    '<div class="pf-btns"><button class="btn g" onclick="closeSheet()">Keep my account</button><button class="btn p del" id="delBtn" onclick="deleteAccount()">Delete my account</button></div>';
  $('sheetOv').classList.add('open');
}
async function deleteAccount() {
  const b = $('delBtn'); b.disabled = true; b.textContent = 'Deleting…';
  const why = (($('delWhy') || {}).value || '').trim();
  let r = await api({ action: 'jr_delete_account', token: tokenGet(), reason: why });
  // Older server (before the delete action shipped): send the request to the church as a note instead.
  if (!r.ok && /unknown action/i.test(r.error || '')) r = await api({ action: 'jr_note', token: tokenGet(), kind: 'note', text: 'ACCOUNT DELETION REQUEST: please delete my Living Stones app account and my personal data (privacy policy, 30 days).' + (why ? ' Note: ' + why : '') });
  if (!r.ok) { b.disabled = false; b.textContent = 'Delete my account'; $('delErr').textContent = r.error || 'Please try again.'; return; }
  closeSheet(); meCacheClear();
  try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k && !/^(lssr_theme|lssr_app_snooze|lssr_install_snooze|lssr_soft_css_v\d+)$/.test(k)) localStorage.removeItem(k); } } catch (e) {}
  await api({ action: 'jr_logout', token: tokenGet() }, 1); tokenSet(''); S.data = null; S.rendered = false; viewSignin(); tellParent();
  toast('Your account is deleted. We’ll confirm when your information is removed.');
}
function closeSheet() { $('sheetOv').classList.remove('open'); $('sheet').className = 'sheet'; }
// "What do these mean?": a gentle explainer, on the same page
function helpSheet() {
  const ic = k => '<svg viewBox="0 0 24 24">' + ICONS[k] + '</svg>';
  const demo = (k, label, on) => '<div class="badge' + (on ? ' on' : '') + '"><i>' + ic(k) + '</i>' + label + '</div>';
  const one = (k, name, txt) => '<li>' + ic(k) + '<div><b>' + name + '</b> · ' + txt + '</div></li>';
  const six = SHOWN_BADGES().map(b => one(b[2], b[1], ({ baptism: 'Going public with your faith in Jesus.', member: 'Making Living Stones your church home.', group: 'Doing life with a few others.', serve: 'Using your gifts to love others.', give: 'Living generously.', lead: 'Helping someone else take their next step.', share: 'Inviting someone to a Sunday gathering.' })[b[0]] || b[3])).join('');
  $('sheet').className = 'sheet help';
  $('sheet').innerHTML = '<button class="help-x" onclick="closeSheet()" aria-label="Close">✕</button><h3>What do these mean?</h3>' +
    '<div class="dim" style="line-height:1.6">You belong to Jesus, and to his church. That belonging grows as we take simple next steps together. These steps are invitations: not requirements, and not a scorecard. Take them whenever you’re ready.</div>' +
    '<div class="hgrid">' +
      '<div class="hbox"><div class="hicons">' + demo('baptism', 'Baptism', true) + demo('group', 'Group', true) + '</div><b>Taken</b><span>You’ve taken this step.</span></div>' +
      '<div class="hbox"><div class="hicons">' + demo('baptism', 'Baptism', false) + demo('group', 'Group', false) + '</div><b>Not yet</b><span>An invitation, whenever you’re ready.</span></div>' +
    '</div>' +
    '<ul class="hl">' + six + '</ul>' +
    (SHOW_LEAD ? '' : '<div class="dim" style="line-height:1.55;font-size:13px;margin-top:10px"><b style="color:var(--text)">Share</b> is a little different: it’s always open, so it never shows as taken or not yet. Tap it any time to invite someone.</div>') +
    '<div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn g" onclick="closeSheet()">Close</button></div>';
  $('sheetOv').classList.add('open');
}
async function sendNote(kind) {
  if (S.preview) return;
  const text = ($('noteTxt') || {}).value || '', b = $('noteBtn');
  if (!text.trim()) return;
  b.disabled = true; b.textContent = 'Sending…';
  const r = await api({ action: 'jr_note', token: tokenGet(), kind: kind, text: text }, 1);
  if (r.ok) { closeSheet(); toast(kind === 'prayer' ? 'Your request has been sent. Thank you for sharing it with us.' : 'Sent. Thank you!'); }
  else { b.disabled = false; b.textContent = 'Send'; toast(r.error || 'That didn’t send — please try again.'); }
}
async function logout() { meCacheClear(); await api({ action: 'jr_logout', token: tokenGet() }, 1); tokenSet(''); S.data = null; S.rendered = false; viewSignin(); tellParent(); }
// Signed-in state for the dashboard (so it can label the tab).
// ── the member app: "Add to Home Screen" (manifest: /journey/manifest.webmanifest, service worker: /sw.js) ──
// Android/Chrome hands us an install prompt; iPhone needs Share → Add to Home Screen. Installed apps on
// iPhone keep their own storage, so people sign in once more inside the app (the 90-day token then lives there).
let _appPrompt = null;
const APP_SNOOZE = 'lssr_app_snooze';
function appStandalone() { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
function appIsIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function appIsPhone() { return /iphone|ipad|ipod|android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && Math.min(screen.width, screen.height) < 820); }
function appCard() {
  const el = $('jrApp'); if (!el) return;
  let snoozed = false; try { snoozed = Number(localStorage.getItem(APP_SNOOZE) || 0) > Date.now(); } catch (e) {}
  if (EMBED || S.preview || appStandalone() || snoozed || !appIsPhone() || !(_appPrompt || appIsIOS())) { el.innerHTML = ''; return; }
  const share = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
  el.innerHTML = '<div class="getapp"><img src="/assets/app/icon-192.png" alt=""><div><b>Get the Living Stones app</b>' +
    (_appPrompt ? '<p>One tap puts this page on your home screen — it opens full-screen, and you stay signed in.</p>' +
                  '<div class="acts"><button class="btn p sm" onclick="appInstall()">Add to Home Screen</button><button class="btn g sm" onclick="appSnooze()">Not now</button></div>'
                : '<p>Tap ' + share + ' <b style="display:inline;font-size:inherit">Share</b> at the bottom of Safari, then <b style="display:inline;font-size:inherit">Add to Home Screen</b>. Open it from your home screen and sign in once more — then you’re set.</p>' +
                  '<div class="acts"><button class="btn g sm" onclick="appSnooze()">Not now</button></div>') +
    '</div></div>';
}
async function appInstall() {
  const p = _appPrompt; _appPrompt = null; if (!p) return appCard();
  try { p.prompt(); const c = await p.userChoice; if (c && c.outcome === 'dismissed') appSnooze(7); else appCard(); } catch (e) { appCard(); }
}
function appSnooze(days) { try { localStorage.setItem(APP_SNOOZE, String(Date.now() + (days || 30) * 864e5)); } catch (e) {} appCard(); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _appPrompt = e; appCard(); });
window.addEventListener('appinstalled', () => { _appPrompt = null; appCard(); toast('Added — find Living Stones on your home screen.'); });

function tellParent() { if (EMBED && !S.preview) { try { parent.postMessage({ jrSignedIn: !!tokenGet(), jrFirst: (S.data && S.data.person && String(S.data.person.first).split(' ')[0]) || '' }, location.origin); } catch (e) {} } }

// ── start ────────────────────────────────────────────────────────────────────
const EMBED = new URLSearchParams(location.search).get('embed') === '1';
if (appStandalone()) document.documentElement.classList.add('standalone');
if (!EMBED && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('/sw.js').catch(() => {});
// The dashboard's Sign out ends this session too.
function extLogout() { meCacheClear(); tokenSet(''); S.data = null; S.rendered = false; viewSignin(); tellParent(); }
window.addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.jrLogout) extLogout(); });
if (EMBED) document.body.classList.add('embed');
if (!EMBED) document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheetOv').classList.contains('open')) closeSheet(); });
if (EMBED) document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if ($('sheetOv').classList.contains('open')) { closeSheet(); e.stopImmediatePropagation(); } else if (paneOpen()) { closePane(); e.stopImmediatePropagation(); } }, true);
(async function start() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.replace(/^#/, ''));
  if (q.get('preview') && h.get('k')) {                     // pastor preview (from the Shepherding drawer)
    S.preview = q.get('preview').replace(/\D/g, ''); S.pw = h.get('k');
    history.replaceState(null, '', location.pathname + '?preview=' + S.preview);   // drop the key from the address bar
    return loadMe();
  }
  if (q.get('m')) {                                         // one-tap link from the sign-in email
    $('app').innerHTML = '<div class="loading">Signing you in…</div>';
    const r = await api({ action: 'jr_magic', m: q.get('m') }, 1);
    history.replaceState(null, '', location.pathname);
    if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
    S.cfg = (await api({ action: 'jr_config' })) || {}; return viewSignin(r.error);
  }
  if (q.get('code') && q.get('state')) {                    // back from "Sign in with Planning Center"
    $('app').innerHTML = '<div class="loading">Finishing sign-in…</div>';
    const r = await api({ action: 'jr_oauth_finish', code: q.get('code'), state: q.get('state') }, 1);
    history.replaceState(null, '', location.pathname);
    if (r.ok && r.token) { tokenSet(r.token); return loadMe(); }
    S.cfg = (await api({ action: 'jr_config' })) || {}; return viewSignin(r.error);
  }
  if (tokenGet()) return loadMe();
  const known = cfgCached();
  if (known) { S.cfg = known; viewSignin(); api({ action: 'jr_config' }).then(c => { if (c && c.ok) { cfgSave(c); S.cfg = c; } }); return; }   // instant sign-in screen, refreshed quietly
  const slow = slowNote('#app', 'Loading… one moment.');
  const cfg = await api({ action: 'jr_config' });
  clearTimeout(slow);
  cfgSave(cfg);
  S.cfg = cfg && cfg.ok ? cfg : { channel: 'email' };
  viewSignin();
})();
</script>
</body>
